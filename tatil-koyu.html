<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tatil Köyü Projesi | Buse İşsever</title>
    <style>
        body 
        {
            background: linear-gradient(135deg, #0f0f0f, #1e1e1e, #2c2c2c);
            color: #eaeaea;
            font-family: "Poppins", sans-serif;
            margin: 0;
            padding: 20px 0; 
        }
        .project-page-container 
        {
            max-width: 900px; 
            margin: 20px auto; 
            background-color: #2a2a2a; 
            padding: 30px 40px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5); 
        }
        .project-header h1 
        {
            font-size: 2.5em;
            margin-top: 0;
            margin-bottom: 10px;
            color: #ffffff;
            border-bottom: 2px solid #8B0000; 
            padding-bottom: 15px;
        }
        .project-header .description {
            font-size: 1.1em;
            color: #ccc;
            line-height: 1.6;
            margin-bottom: 40px;
        }
        .image-gallery img 
        {
            width: 100%; 
            height: auto; 
            display: block; 
            margin-bottom: 25px; 
            border-radius: 5px; 
        }
        .back-button 
        {
            display: inline-block; 
            margin-top: 30px;
            padding: 12px 25px;
            background-color: #555;
            color: white;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: background-color 0.3s ease, transform 0.3s ease;
        }
        .back-button:hover 
        {
            background-color: #777;
            transform: translateY(-2px); 
        }
    </style>
</head>
<body>
    <div class="project-page-container">
        <header class="project-header">
            <h1>🏝️ Tatil Köyü Projesi</h1>
                        <p class="description">
                <strong>Lokasyon:</strong> Bartın/Muğada<br>
                Doğal dokuyla uyumlu, sürdürülebilir bir tatil köyü konsepti.
            </p>
        </header>
        <main class="image-gallery">
            <img src="images/3.png" alt="1">
            <img src="images/4.png" alt="2">
            <img src="images/5.png" alt="3">
            <img src="images/6.png" alt="4">
        </main>
        <footer>
            <a href="index.html" class="back-button">← Ana Sayfaya Geri Dön</a>
        </footer>
    </div>
</body>
</html>
